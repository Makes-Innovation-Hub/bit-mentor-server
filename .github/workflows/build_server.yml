name: Bit mentor telegram bot

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        echo "OPENAI_KEY_DEV=${{ secrets.OPENAI_KEY_DEV }}" >> .env_dev
        echo "DATABASE_NAME_DEV=${{ secrets.DATABASE_NAME_DEV }}" >> .env_dev
        echo "COLLECTION_NAME_DEV=${{ secrets.COLLECTION_NAME_DEV }}" >> .env_dev
        echo "MONGO_CLUSTER_DEV=${{ secrets.MONGO_CLUSTER_DEV }}" >> .env_dev
        echo "MONGO_USERNAME_DEV=${{ secrets.MONGO_USERNAME_DEV }}" >> .env_dev
        echo "MONGO_PASSWORD_DEV=${{ secrets.MONGO_PASSWORD_DEV }}" >> .env_dev
        echo "MOTIVATION_API_DEV=${{ secrets.MOTIVATION_API_DEV }}" >> .env_dev
        echo "YOUTUBE_API_DEV=${{ secrets.YOUTUBE_API_DEV }}" >> .env_dev
        echo "MONGO_CONNECTION_STRING_DEV=${{ secrets.MONGO_CONNECTION_STRING_DEV }}" >> .env_dev
        pytest
