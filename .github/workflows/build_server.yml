name: Bit mentor telegram server

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: create .env_dev file
      run: |
        echo "OPENAI_KEY_DEV=${{ secrets.OPENAI_KEY_DEV }}" >> .env_dev
        echo "DATABASE_NAME_DEV=${{ secrets.DATABASE_NAME_DEV }}" >> .env_dev
        echo "COLLECTION_NAME_DEV=${{ secrets.COLLECTION_NAME_DEV }}" >> .env_dev
        echo "MONGO_CLUSTER_DEV=${{ secrets.MONGO_CLUSTER_DEV }}" >> .env_dev
        echo "MONGO_USERNAME_DEV=${{ secrets.MONGO_USERNAME_DEV }}" >> .env_dev
        echo "MONGO_PASSWORD_DEV=${{ secrets.MONGO_PASSWORD_DEV }}" >> .env_dev
        echo "MOTIVATION_API_DEV=${{ secrets.MOTIVATION_API_DEV }}" >> .env_dev
        echo "YOUTUBE_API_DEV=${{ secrets.YOUTUBE_API_DEV }}" >> .env_dev
        echo "MONGO_CONNECTION_STRING_DEV=${{ secrets.MONGO_CONNECTION_STRING_DEV }}" >> .env_dev

    - name: Test with pytest
      env:
        ENVIRONMENT: dev
      run: |
        python -m pytest --verbose --junit-xml=junit.xml
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v3
      if: success() || failure() # always run even if the previous step fails
      with:
        report_paths: '**/junit.xml'
        detailed_summary: true
        include_passed: true


  docker_deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Install Docker
      run: |
        sudo apt-get update
        sudo apt-get install ca-certificates curl
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc

        # Add the repository to Apt sources:
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update
        sudo apt-get install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin


    - name: Start Docker service
      run: |
        sudo systemctl start docker
        sudo systemctl enable docker

    - name: Check Docker and Docker Compose versions
      run: |
        docker --version
        docker-compose --version

    - name: Log in to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

    - name: Docker Deployment
      run: |
        echo "Running Docker deployment..."
        ./docker-deploy.sh ${{ secrets.DOCKER_HUB_USERNAME }} dev


