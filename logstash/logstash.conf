input {
  file {
    path => "/path/to/your/logfile.log"    # Replace with the actual path to your log file
    start_position => "beginning"
    sincedb_path => "/dev/null"            # This ensures Logstash reads the file from the beginning
  }
}

filter {
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{DATA:logger_name} - %{UUID:request_id} - %{LOGLEVEL:log_level} - %{GREEDYDATA:log_message}" }
  }

  date {
    match => [ "timestamp", "ISO8601" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]  # Update to your Elasticsearch URL if different
    index => "app_logs"
  }
  stdout { codec => rubydebug }  # Outputs to the console for debugging
}
